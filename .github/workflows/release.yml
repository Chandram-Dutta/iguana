# Pushing a tag such as v0.2.0 builds the app for Apple silicon and Intel, signs it with the
# Developer ID, has Apple notarize it, and publishes a GitHub release with the disk image, the
# zip, the Homebrew cask and the checksums.
#
# It needs four repository secrets (Settings > Secrets and variables > Actions):
#
#   DEVELOPER_ID_P12           the Developer ID Application certificate with its private key,
#                              exported from Keychain Access as a .p12 file, base64-encoded
#   DEVELOPER_ID_P12_PASSWORD  the password chosen when exporting it
#   APPLE_ID                   the Apple ID of the developer account
#   APPLE_APP_PASSWORD         an app-specific password for that Apple ID
#
# Without them the workflow says so and stops, and a release can still be made by hand:
# scripts/release.sh, then scripts/publish.sh.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, for example v0.2.0. It must already exist.
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HAS_SECRETS: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - name: Signing secrets
        run: |
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::notice::The signing secrets are not set, so nothing was built. See the top of .github/workflows/release.yml."
          fi

      - uses: actions/checkout@v5
        if: env.HAS_SECRETS == 'true'
        with:
          ref: ${{ env.TAG }}

      - name: The tag matches the version in the source
        if: env.HAS_SECRETS == 'true'
        run: |
          VERSION="$(sed -nE 's/.*static let version = "([^"]+)".*/\1/p' Sources/iguana/Iguana.swift)"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::The tag is $TAG but Iguana.version is $VERSION."
            exit 1
          fi

      - name: Certificate and notarization credentials
        if: env.HAS_SECRETS == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # A keychain of its own for this run, so that nothing asks for a password.
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          TEAM_ID="$(sed -nE 's/^export TEAM_ID="\$\{TEAM_ID:-([A-Z0-9]+)\}"/\1/p' scripts/release.sh)"
          xcrun notarytool store-credentials iguana --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - name: Build, sign, notarize and package
        if: env.HAS_SECRETS == 'true'
        env:
          NOTARY_PROFILE: iguana
          RELEASE_URL_BASE: https://github.com/${{ github.repository }}/releases/download
          HOMEPAGE: https://iguana.onlychan.xyz/
        run: scripts/release.sh

      - name: Publish
        if: env.HAS_SECRETS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish.sh "$TAG"
