# The website: built from docs/ and put on Cloudflare whenever main changes.
#
# It needs two repository secrets:
#
#   CLOUDFLARE_API_TOKEN    a token allowed to edit Workers for the account
#   CLOUDFLARE_ACCOUNT_ID   the account's identifier
#
# Without them it builds the site, as a check, and deploys nothing.
name: Site

on:
  push:
    branches: [main]
    paths: ['docs/**', 'Sources/IguanaCore/**', '.github/workflows/site.yml']
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::The Cloudflare secrets are not set, so the site was built but not deployed."
            exit 0
          fi
          npx wrangler@4 deploy
